<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JobFlow AI</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#eaf3fa;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:22px 16px}h1{margin:0}p,small{color:#aebed0}.panel,.stat{background:#172235;border:1px solid #304056;border-radius:14px;padding:18px}.panel{margin-top:18px}.stats,.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.fields{grid-template-columns:repeat(2,1fr)}.stat strong{font-size:24px;display:block;margin-top:8px}label{font-size:13px;color:#ced9e7;display:block;margin:10px 0 5px}input,textarea{width:100%;font:inherit;background:#0d1728;border:1px solid #465772;border-radius:8px;color:white;padding:10px}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:700;background:#58d3b0;color:#05231b}button.secondary{background:#34465f;color:white}button.danger{background:#7d3947;color:white}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.job{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #34465f}.job small{display:block;margin-top:5px}#status{min-height:22px;color:#80f0c5}@media(max-width:640px){.stats,.fields{grid-template-columns:1fr}.job{flex-direction:column}}
</style></head><body><main>
<h1>JobFlow AI</h1><p>Book jobs, track payments and get reminders.</p>
<section class="stats"><div class="stat">Upcoming jobs<strong id="upcoming">0</strong></div><div class="stat">Unpaid total<strong id="unpaid">$0</strong></div><div class="stat">Paid total<strong id="paid">$0</strong></div></section>
<section class="panel"><h2>Add a job</h2><div class="fields">
<div><label for="customer">Customer</label><input id="customer" placeholder="Mike"></div>
<div><label for="service">Service</label><input id="service" placeholder="Car detailing"></div>
<div><label for="price">Price</label><input id="price" type="number" min="0" step="0.01" placeholder="150"></div>
<div><label for="when">Date and time</label><input id="when" type="datetime-local"></div></div>
<label for="notes">Notes / address</label><textarea id="notes" rows="2"></textarea>
<div class="actions"><button id="save">Save booking</button><button id="speak" class="secondary">🎙 Speak booking</button></div><p id="status" role="status"></p></section>
<section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>Bookings</h2><button class="secondary" id="export">Export backup</button></div><div id="jobs"></div></section>
<p><small>Prototype only: jobs are saved on this device. Reminders only work while the page is open. No cloud sync, Google Calendar connection or background push yet.</small></p>
</main><script>
'use strict';
const $=id=>document.getElementById(id), key='jobflow-ai-v1';
let jobs=[];try{jobs=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(jobs))jobs=[]}catch{jobs=[]}
const save=()=>localStorage.setItem(key,JSON.stringify(jobs));
const money=n=>'$'+Number(n||0).toFixed(2);
function render(){
 $('upcoming').textContent=jobs.filter(j=>new Date(j.when).getTime()>=Date.now()).length;
 $('unpaid').textContent=money(jobs.filter(j=>!j.paid).reduce((n,j)=>n+Number(j.price),0));
 $('paid').textContent=money(jobs.filter(j=>j.paid).reduce((n,j)=>n+Number(j.price),0));
 const root=$('jobs');root.replaceChildren();
 if(!jobs.length){let p=document.createElement('p');p.textContent='No jobs yet. Add your first booking.';root.append(p)}
 for(const j of [...jobs].sort((a,b)=>new Date(a.when)-new Date(b.when))){
 const row=document.createElement('div');row.className='job';
 const info=document.createElement('div'), name=document.createElement('strong'), detail=document.createElement('small'), note=document.createElement('small');
 name.textContent=j.customer+' — '+j.service;detail.textContent=new Date(j.when).toLocaleString()+' · '+money(j.price)+' · '+(j.paid?'Paid':'Unpaid');note.textContent=j.notes||'';info.append(name,detail,note);
 const actions=document.createElement('div');actions.className='actions';
 const pay=document.createElement('button');pay.className='secondary';pay.textContent=j.paid?'Mark unpaid':'Mark paid';pay.onclick=()=>{j.paid=!j.paid;save();render()};
 const del=document.createElement('button');del.className='danger';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete this booking?')){jobs=jobs.filter(x=>x.id!==j.id);save();render()}};
 actions.append(pay,del);row.append(info,actions);root.append(row);
 }
}
$('save').onclick=()=>{
 const customer=$('customer').value.trim(),service=$('service').value.trim(),when=$('when').value,price=Number($('price').value);
 if(!customer||!service||!when||!$('price').value||!Number.isFinite(price)||price<0){$('status').textContent='Enter customer, service, price and date/time.';return}
 jobs.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),customer,service,when,price,notes:$('notes').value.trim(),paid:false,reminded:false});
 save();render();for(const id of ['customer','service','price','when','notes'])$(id).value='';$('status').textContent='Booking saved!';
};
$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(jobs,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='jobflow-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
function reminders(){for(const j of jobs){const ms=new Date(j.when).getTime()-Date.now();if(!j.reminded&&ms>0&&ms<=1800000){j.reminded=true;save();const msg=j.service+' with '+j.customer+' at '+new Date(j.when).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});$('status').textContent='Reminder: '+msg;if('Notification'in window&&Notification.permission==='granted')new Notification('JobFlow reminder',{body:msg});else alert('JobFlow reminder: '+msg)}}}
setInterval(reminders,30000);reminders();
$('speak').onclick=()=>{const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){$('status').textContent='Voice input not supported in this browser.';return}const r=new Speech();r.lang='en-NZ';r.onresult=e=>{const s=e.results[0][0].transcript;$('notes').value=s;const name=s.match(/(?:with|for)\s+([A-Za-z]+)\b/i),price=s.match(/\$\s*(\d+(?:\.\d+)?)/);if(name)$('customer').value=name[1];if(price)$('price').value=price[1];$('status').textContent='Speech copied to notes. Check the details before saving.'};r.onerror=()=>{$('status').textContent='Microphone failed or permission denied.'};r.start()};
render();
</script></body></html>
